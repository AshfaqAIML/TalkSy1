    <path d="M-27 44 q 6 -8 12 0" stroke="#c7b494" stroke-width="3" fill="none"/>
    <rect x="14" y="48" width="16" height="16" rx="3" fill="#4f9d6b"/>
    <path d="M17 48 q 5 -7 10 0" stroke="#c7b494" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(158,238)">
