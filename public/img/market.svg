    <path d="M0 18 q -16 8 -16 34 l 32 0 q 0 -26 -16 -34" fill="#c95d7a"/>
    <rect x="-14" y="52" width="11" height="24" rx="5" fill="#5a4a6a"/>
    <rect x="3" y="52" width="11" height="24" rx="5" fill="#5a4a6a"/>
    <!-- bags -->
