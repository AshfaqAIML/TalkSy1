    <rect x="180" y="182" width="12" height="98" fill="#8a5a33"/>
    <rect x="364" y="182" width="12" height="98" fill="#8a5a33"/>
    <!-- awning -->
    <path d="M156 118 L 400 118 L 412 152 L 144 152 Z" fill="#e05252"/>
    <path d="M186 118 L 214 118 L 226 152 L 198 152 Z" fill="#f5f2e8"/>
    <path d="M244 118 L 272 118 L 284 152 L 256 152 Z" fill="#f5f2e8"/>
    <path d="M302 118 L 330 118 L 342 152 L 314 152 Z" fill="#f5f2e8"/>
    <path d="M360 118 L 388 118 L 400 152 L 372 152 Z" fill="#f5f2e8"/>
    <!-- fruit crates -->
    <rect x="180" y="146" width="94" height="24" rx="4" fill="#c98d4f"/>
    <rect x="284" y="146" width="94" height="24" rx="4" fill="#c98d4f"/>
    <g>
      <circle cx="196" cy="150" r="8" fill="#e05252"/><circle cx="214" cy="150" r="8" fill="#e05252"/>
      <circle cx="232" cy="150" r="8" fill="#e05252"/><circle cx="250" cy="150" r="8" fill="#e05252"/>
      <circle cx="205" cy="143" r="8" fill="#ef6d6d"/><circle cx="241" cy="143" r="8" fill="#ef6d6d"/>
    </g>
    <g>
      <circle cx="300" cy="150" r="8" fill="#f7a23c"/><circle cx="318" cy="150" r="8" fill="#f7a23c"/>
      <circle cx="336" cy="150" r="8" fill="#f7a23c"/><circle cx="354" cy="150" r="8" fill="#f7a23c"/>
      <circle cx="309" cy="143" r="8" fill="#f9b45e"/><circle cx="345" cy="143" r="8" fill="#f9b45e"/>
    </g>
  </g>
  <!-- Clothes stall with a yellow dress -->
  <g>
    <rect x="430" y="176" width="180" height="12" rx="4" fill="#8a5a33"/>
    <rect x="440" y="188" width="10" height="92" fill="#8a5a33"/>
    <rect x="590" y="188" width="10" height="92" fill="#8a5a33"/>
    <path d="M418 130 L 622 130 L 632 160 L 408 160 Z" fill="#4f9d6b"/>
    <path d="M452 130 L 478 130 L 488 160 L 462 160 Z" fill="#f5f2e8"/>
    <path d="M506 130 L 532 130 L 542 160 L 516 160 Z" fill="#f5f2e8"/>
    <path d="M560 130 L 586 130 L 596 160 L 570 160 Z" fill="#f5f2e8"/>
