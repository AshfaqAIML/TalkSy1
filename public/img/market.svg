    <!-- yellow dress -->
    <path d="M486 166 L 482 178 L 476 208 Q 490 216 506 216 Q 522 216 536 208 L 530 178 L 526 166 Q 506 174 486 166 Z" fill="#f7c948"/>
    <!-- shirts -->
