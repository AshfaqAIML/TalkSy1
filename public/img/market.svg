    <circle cx="0" cy="0" r="9" fill="#f2c19a"/>
    <path d="M0 9 q -11 6 -11 24 l 22 0 q 0 -18 -11 -24" fill="#f7a23c"/>
    <rect x="-9" y="33" width="8" height="17" rx="4" fill="#8a5a33"/>
    <rect x="1" y="33" width="8" height="17" rx="4" fill="#8a5a33"/>
    <path d="M6 14 q 12 -6 20 -12" stroke="#f2c19a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- bunting -->
  <path d="M60 84 Q 360 116 660 84" stroke="#8a5a33" stroke-width="3" fill="none"/>
  <g>
    <path d="M120 94 l 12 2 l -7 12 Z" fill="#4f9d6b"/>
    <path d="M210 101 l 12 1 l -6 12 Z" fill="#e05252"/>
    <path d="M300 104 l 12 0 l -5 12 Z" fill="#f7c948"/>
    <path d="M390 103 l 12 -1 l -3 12 Z" fill="#4f7de0"/>
    <path d="M480 98 l 12 -2 l -1 12 Z" fill="#b06ad4"/>
    <path d="M570 90 l 12 -3 l 1 12 Z" fill="#4f9d6b"/>
  </g>
