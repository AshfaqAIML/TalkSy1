<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="A busy market street: a striped awning over a fruit stall with apples and oranges, a second stall with a yellow dress, and a girl with her mother carrying shopping bags">
  <rect width="720" height="360" rx="16" fill="#fbf3e4"/>
  <!-- Street -->
  <rect x="0" y="280" width="720" height="80" fill="#d9c9ae"/>
  <rect x="0" y="276" width="720" height="8" fill="#c7b494"/>
  <!-- Backdrop buildings -->
  <g>
    <rect x="30" y="120" width="130" height="156" rx="6" fill="#e7d4b8"/>
    <rect x="58" y="146" width="26" height="30" rx="4" fill="#b8d4de"/>
    <rect x="106" y="146" width="26" height="30" rx="4" fill="#b8d4de"/>
    <rect x="58" y="200" width="26" height="30" rx="4" fill="#b8d4de"/>
    <rect x="106" y="200" width="26" height="30" rx="4" fill="#b8d4de"/>
    <rect x="560" y="100" width="140" height="176" rx="6" fill="#e0c9a8"/>
    <rect x="588" y="128" width="28" height="32" rx="4" fill="#b8d4de"/>
    <rect x="640" y="128" width="28" height="32" rx="4" fill="#b8d4de"/>
    <rect x="588" y="186" width="28" height="32" rx="4" fill="#b8d4de"/>
    <rect x="640" y="186" width="28" height="32" rx="4" fill="#b8d4de"/>
